<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 90" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#f1f5f9" stop-opacity="0.9" />
      <stop offset="85%" stop-color="#94a3b8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#475569" stop-opacity="0.8" />
    </linearGradient>
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>
  <g filter="url(#cloudShadow)">
    <!-- Base stylized stepped clouds -->
    <path d="M 20 70 L 180 70 A 10 10 0 0 0 180 50 A 25 25 0 0 0 155 30 A 35 35 0 0 0 95 20 A 30 30 0 0 0 45 35 A 25 25 0 0 0 20 60 A 10 10 0 0 0 20 70 Z" fill="url(#cloudGrad)" />
    <!-- Horizontal shaded lines for retro woodblock / screenprint feel -->
    <path d="M 28 64 L 172 64 M 40 56 L 160 56 M 60 48 L 140 48" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
